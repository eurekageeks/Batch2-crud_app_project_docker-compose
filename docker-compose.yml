version: "3.8"

services:
  backend:
    build: .
    container_name: crudeapp-backend
    restart: always

    ports:
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: test_db

  frontend:
    image: nginx:alpine
    container_name: crudeapp-frontend
    restart: always

    ports:
      - "8080:80"

    volumes:
      - ./frontend:/usr/share/nginx/html

    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: crudeapp-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
